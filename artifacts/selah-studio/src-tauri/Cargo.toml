[package]
name = "selah-studio"
version = "1.0.0"
description = "Selah Studio church presentation desktop app"
authors = ["Selah Studio"]
edition = "2021"

[lib]
name = "selah_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
axum = "0.7"
base64 = "0.22"
if-addrs = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
